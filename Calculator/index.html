
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Ayush Yadav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h2>My <span>Calculator</span></h2>
        <p>A simple and responsive calculator</p>
    </header>

    <main class="calculator-container">

        <div class="calculator">

            <!-- Calculator Display -->
            <div class="display">
                <div id="previousOperand" class="previous-operand"></div>
                <div id="currentOperand" class="current-operand">0</div>
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="btn function" data-action="clear">AC</button>
                <button class="btn function" data-action="delete">DEL</button>
                <button class="btn function" data-action="percent">%</button>
                <button class="btn operator" data-operator="÷">÷</button>

                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn operator" data-operator="×">×</button>

                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn operator" data-operator="-">−</button>

                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn operator" data-operator="+">+</button>

                <button class="btn function" data-action="sign">+/-</button>
                <button class="btn" data-number="0">0</button>
                <button class="btn" data-action="decimal">.</button>
                <button class="btn equal" data-action="calculate">=</button>

            </div>
        </div>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Ayush Yadav | CodeAlpha Internship Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
